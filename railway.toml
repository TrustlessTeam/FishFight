[build]
builder = "NIXPACKS"

[build.env]
CI = "false"
NODE_VERSION = "18"

[deploy]
healthcheckPath = "/health.html"
healthcheckTimeout = 60

[variables]
REACT_APP_FRONTEND_NETWORK = "mainnet"
